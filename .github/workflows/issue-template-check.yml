name: Issue Template Check

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

jobs:
  validate-task:
    name: Validate task request
    if: ${{ !startsWith(github.event.issue.title, '[WEEKLY]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture issue body
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            fs.writeFileSync('issue.md', context.payload.issue.body || '', 'utf8');
      - name: Validate template
        run: python3 scripts/issue_automation.py validate issue.md
      - name: Comment result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- task-template-check -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              per_page: 100
            });
            const previous = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            const status = '${{ job.status }}';
            const message = status === 'success'
              ? `${marker}\n## Issue 模板检测通过\n\n任务、交付或审查模板字段已通过自动化解析。`
              : `${marker}\n## Issue 模板检测未通过\n\n请检查标题、清单、元数据表和占位符是否已完整填写。`;
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body: message
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: message
              });
            }
